[project]
name = "charlando-servidor"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.9",
    "transformers>=5.20.2",
    "accelerate",
    "librosa",
    "soundfile",
    "websockets",
    "claude-agent-sdk",
    "numpy",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
